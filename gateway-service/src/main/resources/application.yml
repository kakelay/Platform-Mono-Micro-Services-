server:
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - AddResponseHeader=X-Frame-Options,DENY
        - AddResponseHeader=X-Content-Type-Options,nosniff
        - AddResponseHeader=X-XSS-Protection,1; mode=block
      discovery:
        locator:
          enabled: false
    discovery:
      enabled: true
  data:
    redis:
      host: redis
      port: 6379
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-service:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:default-secret-key-default-secret-key}
