spring:
  profiles: dev
  cloud:
    discovery:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:dev-secret-key-dev-secret-key}
