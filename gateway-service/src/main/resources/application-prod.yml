spring:
  profiles: prod
  cloud:
    discovery:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-service:8761/eureka/}
security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:prod-secret-key-prod-secret-key}
