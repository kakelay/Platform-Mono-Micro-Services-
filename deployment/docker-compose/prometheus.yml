global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "spring"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "gateway-service:8080"
          - "config-service:8888"
          - "discovery-service:8761"
          - "auth-service:8081"
          - "user-service:8082"
          - "customer-service:8083"
          - "account-service:8084"
          - "transaction-service:8085"
          - "payment-service:8087"
          - "order-service:8086"
          - "notification-service:8088"
          - "document-service:8089"
          - "audit-service:8090"
          - "reporting-service:8091"
